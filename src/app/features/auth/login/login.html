<div class="login-container">
  <div class="login-card">
    <h2>Iniciar Sesión</h2>

    <div *ngIf="errorMessage" class="error-alert">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmitEmail()">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input id="email" formControlName="email" type="email" placeholder="tucorreo@ejemplo.com" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" formControlName="password" type="password" placeholder="••••••" />
      </div>

      <button type="submit" [disabled]="loginForm.invalid || cargando" class="btn-primary">
        {{ cargando ? 'Entrando...' : 'Entrar con Correo' }}
      </button>
    </form>

    <div class="divider">
      <span>o</span>
    </div>

    <button (click)="onLoginGoogle()" [disabled]="cargando" class="btn-google">
      <span class="google-icon">G</span> Continuar con Google
    </button>
  </div>
</div>
