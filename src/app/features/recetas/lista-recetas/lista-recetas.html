<div class="container">
  <div class="header-actions">
    <h2>Explorar Recetas</h2>
    <button mat-flat-button color="accent" (click)="crearRecetaDemo()">
      + Receta de Prueba
    </button>
  </div>

  @if (recetas$ | async; as recetas) {
    @if (recetas.length > 0) {
      <div class="grid-recetas">
        @for (receta of recetas; track receta.id) {
          <app-receta-card [receta]="receta"></app-receta-card>
        }
      </div>
    } @else {
      <div class="empty-state">
        <p>No hay recetas disponibles aún. ¡Añade la primera!</p>
      </div>
    }
  } @else {
    <div class="spinner-container">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  }
</div>
